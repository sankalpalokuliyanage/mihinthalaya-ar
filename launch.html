<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official Website Launch of the Korea Sri Lanka Maha Viharaya.">
  <meta name="keywords" content="Korea Sri Lanka Maha Viharaya, Official Launch, Sri Lankan Buddhist Temple Korea">
  <meta name="author" content="Korea Sri Lanka Maha Viharaya">
  <link rel="icon" type="image/x-icon" href="assets/logo.png">
  <title>Official Launch | Mihinthayala</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            templeMaroon: '#6B1E1E',
            templeGold: '#D4AF37',
            templeCream: '#FFF8E7',
            templeCharcoal: '#1F2937',
            templeBrown: '#7C5C3B',
            lightGold: '#F5E6B3',
          },
          fontFamily: {
            sans: ['Poppins', 'Noto Sans Sinhala', 'sans-serif'],
            serif: ['Georgia', 'serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 1s ease-out forwards',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-templeCharcoal">

  <main class="h-screen flex flex-col items-center justify-center text-center p-4 sm:p-6 relative overflow-hidden">
    
    <div class="w-full max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-center gap-6 md:gap-10 lg:gap-16">

      <!-- Video Player in Foreground -->
      <div class="w-full md:w-1/2 lg:w-3/5 relative max-w-2xl mx-auto rounded-2xl shadow-2xl shadow-black/50 overflow-hidden border-2 border-templeGold/30 animate-fade-in-up">
        <video id="launch-video" autoplay loop muted class="w-full h-full object-cover aspect-video">
          <!-- Use your video file here -->
          <source src="assets/launchvideo.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <!-- Sound Toggle Button for Video -->
        <button id="sound-toggle-btn" class="absolute bottom-3 right-3 z-20 p-2.5 rounded-full bg-black/40 text-white backdrop-blur-sm hover:bg-black/60 transition-colors" aria-label="Toggle Sound">
          <!-- Muted Icon -->
          <svg id="icon-muted" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .89-1.077 1.337-1.707.707L5.586 15z"></path></svg>
          <!-- Unmuted Icon -->
          <svg id="icon-unmuted" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M12 5v14c0 .89-1.077 1.337-1.707.707L5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5z"></path></svg>
        </button>
      </div>

      <!-- Content Box -->
      <div class="w-full md:w-1/2 lg:w-2/5 relative z-10 flex flex-col items-center md:items-start space-y-5 md:text-left animate-fade-in-up" style="animation-delay: 200ms;">
        <!-- Title -->
        <div class="space-y-3">
          <span class="inline-block px-4 py-1.5 rounded-full bg-templeGold/20 border border-templeGold/40 text-templeGold text-sm font-semibold tracking-wider uppercase animate-pulse">
            1st Time
          </span>
          <h1 class="text-3xl sm:text-4xl font-bold text-white font-serif text-shadow-premium">
            Mixed Reality මිහින්තලය Launch
          </h1>
          <h2 class="text-xl sm:text-2xl font-semibold text-lightGold font-sans -mt-2">
            Experience the Spiritual Aura of මිහින්තලය in 3D
          </h2>
        </div>

        <!-- Launch Button -->
        <a href="index.html" class="inline-block bg-templeGold text-templeMaroon hover:bg-white font-bold text-lg px-10 py-3.5 rounded-xl shadow-lg shadow-templeGold/30 transition-all duration-300 transform hover:scale-105">
          Launch Now
        </a>
      </div>

    </div>

    <!-- Footer Copyright -->
    <footer class="absolute bottom-4 text-xs text-gray-400/60 z-10">
      2026 &copy; Sankalpa Lokuliyanage and Thathsara Nanayakkara. All rights reserved.
    </footer>

  </main>

</body>
</html>
